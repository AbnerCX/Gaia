{% load static %}

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nueva Pregunta</title>
    <link href="{% static 'css/output.css' %}" rel="stylesheet">
</head>
<body class="bg-gray-100 text-gray-800">
    <div class="max-w-7xl mx-auto px-4 py-6">

        <!-- Navegación -->
        <div class="flex justify-between items-center mb-6">
            <a href="{% url 'home' %}" class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600">
                Volver
            </a>
            <form method="POST" action="{% url 'logout' %}">
                {% csrf_token %}
                <button type="submit" class="bg-red-500 text-white px-4 py-2 rounded hover:bg-red-600">
                    Cerrar sesión
                </button>
            </form>
        </div>

        <!-- Título -->
        <h1 class="text-3xl font-bold text-center mb-6">Nueva Pregunta</h1>

        <!-- Formulario para Nueva Pregunta -->
        <form method="post" class="bg-white p-6 rounded-lg shadow-lg">
            {% csrf_token %}
            <div class="space-y-4">
                <!-- Estiliza inputs y textarea -->
                {{ form.as_p }}
            </div>
            <button type="submit" class="bg-blue-500 text-white px-6 py-2 rounded hover:bg-blue-600 mt-4 w-full">
                Publicar
            </button>
        </form>

    </div>

    <!-- Estilos personalizados para los inputs -->
    <style>
        input[type="text"], textarea, select {
            border: 1px solid #D1D5DB; /* Color gris claro para el borde */
            border-radius: 0.5rem; /* Bordes redondeados */
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.1); /* Sombra ligera */
            padding: 0.5rem; /* Espaciado interno */
            width: 100%; /* Tamaño completo */
            background-color: #F9FAFB; /* Fondo claro */
        }

        input[type="text"]:focus, textarea:focus {
            outline: none; /* Elimina el borde azul por defecto */
            border-color: #3B82F6; /* Color del borde cuando está activo */
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.3); /* Sombra con un toque azul */
        }
    </style>
</body>
</html>
