{% load static %}

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Realizar Simulación</title>
    <link href="{% static 'css/output.css' %}" rel="stylesheet">
</head>
<body class="bg-gray-100 text-gray-800">
    <div class="max-w-4xl mx-auto px-4 py-6">

        <!-- Navegación -->
        <div class="flex justify-between items-center mb-6">
            <a href="{% url 'home' %}" class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600">
                Volver
            </a>
            <form method="POST" action="{% url 'logout' %}">
                {% csrf_token %}
                <button type="submit" class="bg-red-500 text-white px-4 py-2 rounded hover:bg-red-600">
                    Cerrar sesión
                </button>
            </form>
        </div>

        <!-- Título -->
        <h1 class="text-3xl font-bold text-center mb-6">Realizar Simulación</h1>

        <!-- Formulario -->
        <form method="POST" class="bg-white p-6 rounded-lg shadow-lg">
            {% csrf_token %}

            <!-- Error -->
            {% if error %}
                <p class="text-red-500 font-semibold mb-4">{{ error }}</p>
            {% endif %}

            <div class="mb-4">
                <label for="campo" class="block text-gray-700 font-semibold">Selecciona tu campo:</label>
                <select name="campo" id="campo" class="mt-2 p-2 w-full border rounded-lg" required>
                    <option value="">Selecciona un campo</option>
                    {% for campo in campos %}
                        <option value="{{ campo.id }}">{{ campo.nombre }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="mb-4">
                <label for="cultivo" class="block text-gray-700 font-semibold">Selecciona tu cultivo:</label>
                <select name="cultivo" id="cultivo" class="mt-2 p-2 w-full border rounded-lg" required>
                    <option value="">Selecciona un cultivo</option>
                    {% for cultivo in cultivos %}
                        <option value="{{ cultivo.id }}">{{ cultivo.tipo_cultivo.nombre }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="mb-4">
                <label for="humedad" class="block text-gray-700 font-semibold">Humedad (en %):</label>
                <input type="number" step="0.01" name="humedad" id="humedad" class="mt-2 p-2 w-full border rounded-lg" required>
            </div>

            <div class="mb-4">
                <label for="temperatura" class="block text-gray-700 font-semibold">Temperatura (°C):</label>
                <input type="number" step="0.01" name="temperatura" id="temperatura" class="mt-2 p-2 w-full border rounded-lg" required>
            </div>

            <div class="mb-4">
                <label for="precipitacion" class="block text-gray-700 font-semibold">Precipitación (mm):</label>
                <input type="number" step="0.01" name="precipitacion" id="precipitacion" class="mt-2 p-2 w-full border rounded-lg" required>
            </div>

            <button type="submit" class="bg-green-500 text-white px-6 py-2 rounded-lg hover:bg-green-600 w-full mt-4">
                Evaluar
            </button>
        </form>
    </div>
</body>
</html>
