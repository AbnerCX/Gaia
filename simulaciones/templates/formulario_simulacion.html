{% load static %}

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Realizar Simulación</title>
    <link href="{% static 'css/output.css' %}" rel="stylesheet">
</head>
<body class="bg-gradient-to-br from-emerald-300 via-amber-200 to-brown-300 text-gray-800 min-h-screen w-full overflow-x-hidden">
    <div class="max-w-4xl mx-auto px-4 py-6">

        <!-- Navegación -->
        <div class="flex justify-between items-center mb-6">
            <a href="{% url 'home' %}" class="bg-blue-500 text-white font-semibold px-5 py-2 rounded-lg transition-all duration-300 ease-in-out hover:bg-blue-700 hover:scale-105 shadow-md">
                Volver
            </a>
            <form method="POST" action="{% url 'logout' %}">
                {% csrf_token %}
                <button type="submit" class="bg-red-500 text-white font-semibold px-5 py-2 rounded-lg transition-all duration-300 ease-in-out hover:bg-red-700 hover:scale-105 shadow-md">
                    Cerrar sesión
                </button>
            </form>
        </div>

        <!-- Título -->
        <h1 class="text-5xl font-extrabold text-center mb-10 text-green-800 tracking-wide drop-shadow-md">Realizar Simulación</h1>

        <!-- Formulario -->
        <form method="POST" class="bg-[#e0e0e0] p-6 rounded-lg shadow-xl hover:shadow-2xl ">
            {% csrf_token %}

            <!-- Error -->
            {% if error %}
                <p class="text-red-500 font-semibold mb-4">{{ error }}</p>
            {% endif %}

            <div class="mb-4">
                <label for="campo" class="block text-black">Selecciona tu campo:</label>
                <select name="campo" id="campo" class="mt-2 p-2 w-full bg-white border-2 border-black rounded-lg shadow"required>
                    <option value="">Selecciona un campo</option>
                    {% for campo in campos %}
                        <option value="{{ campo.id }}">{{ campo.nombre }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="mb-4">
                <label for="cultivo" class="block text-black">Selecciona tu cultivo:</label>
                <select name="cultivo" id="cultivo" class="mt-2 p-2 w-full bg-white border-2 border-black rounded-lg shadow" required>
                    <option value="">Selecciona un cultivo</option>
                    {% for cultivo in cultivos %}
                        <option value="{{ cultivo.id }}">{{ cultivo.tipo_cultivo.nombre }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="mb-4">
                <label for="humedad" class="block text-black">Humedad (en %):</label>
                <input type="number" step="0.01" name="humedad" id="humedad" class="mt-2 p-2 w-full  bg-white border-2 border-black rounded-lg shadow" required>
            </div>

            <div class="mb-4">
                <label for="temperatura" class="block text-black ">Temperatura (°C):</label>
                <input type="number" step="0.01" name="temperatura" id="temperatura"class="mt-2 p-2 w-full bg-white border-2 border-black rounded-lg shadow" required>
            </div>

            <div class="mb-4">
                <label for="precipitacion" class="block text-black">Precipitación (mm):</label>
                <input type="number" step="0.01" name="precipitacion" id="precipitacion" class="mt-2 p-2 w-full bg-white border-2 border-black rounded-lg shadow" required>
            </div>

        <div class="mb-2 text-center">
            <button type="submit" class="inline-block mx-auto bg-green-500 text-white font-semibold px-48 py-3 rounded-lg hover:bg-green-700 hover:scale-105 transition-all duration-300 ease-in-out shadow-md  mt-2">
                Evaluar
            </button>
        </div>
        </form>
    </div>
</body>
</html>
